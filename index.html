<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Paulo Henrique | Full Stack Developer" />
    <meta property="og:description" content="Portfolio" />
    <meta
      property="og:image"
      content="https://DevoluaP.github.io/Meu_Portfolio/imagens/logo.svg"
    />
    <meta name="author" content="Paulo Henrique" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="canonical" href="https://DevoluaP.github.io/Meu_Portfolio/" />
    <link rel="shortcut icon" href="imagens/icon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://vlibras.gov.br" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <title></title>
  </head>
  <body>
    <header>
      <nav>
        <div id="header-controls">
          <button id="btn-theme">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="#F0EDEE"
              class="bi bi-lightbulb"
              viewBox="0 0 16 16"
            >
              <path
                d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13a.5.5 0 0 1 0 1 .5.5 0 0 1 0 1l-.224.447a1 1 0 0 1-.894.553H6.618a1 1 0 0 1-.894-.553L5.5 15a.5.5 0 0 1 0-1 .5.5 0 0 1 0-1 .5.5 0 0 1-.46-.302l-.761-1.77a2 2 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.467c.162-.377.413-.687.676-.941A5 5 0 0 0 8 1"

          </button>
          <div id="lang-dropdown" class="lang-dropdown">
            <button
              id="lang-dropdown-btn"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              data-translate-title="lang.select"
            >
              <img id="lang-current-flag" />
              <span id="lang-current-label"></span>
              <svg
                class="lang-caret"
                xmlns="http://www.w3.org/2000/svg"
                width="10"
                height="10"
                viewBox="0 0 16 16"
                fill="currentColor"
              >
                <path d="M8 11 3 6h10z" />
              </svg>
            </button>
            <ul
              id="lang-dropdown-list"
              class="lang-dropdown-list"
              role="listbox"
            ></ul>
          </div>
        </div>
        <svg
          id="btn-menu"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          fill="#F0EDEE"
          class="bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"
          />
        </svg>
        <svg
          id="btn-close"
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          fill="#F0EDEE"
          class="bi bi-x"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>
        <ul class="menu">
          <li><a href="#home" data-translate="nav.home"></a></li>
          <li><a href="#about" data-translate="nav.about"></a></li>
          <li>
            <a href="#knowledge" data-translate="nav.skills"></a>
          </li>
          <li>
            <a href="#projects" data-translate="nav.projects"></a>
          </li>
          <li><a href="#contact" data-translate="nav.contact"></a></li>
        </ul>
      </nav>
    </header>
    <main>
      <article id="home">
        <img
          class="home-img"
          src="imagens/logo.svg"
          data-translate-alt="home.bannerAlt"
          title="/>aulo"
        />
        <div>
          <h2 data-translate="home.welcome"></h2>
          <h1>Paulo Henrique</h1>
          <h1 data-translate="home.role"></h1>
        </div>
        <section>
          <a
            href="https://github.com/DevoluaP"
            target="_blank"
            rel="noopener noreferrer"
            data-translate-title="home.github"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              fill="#0A090C"
              class="bi bi-github"
              viewBox="0 0 16 16"
            >
              <path

          <a

            target="_blank"
            rel="noopener noreferrer"
            data-translate-title="home.linkedin"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              fill="#0A090C"
              class="bi bi-linkedin"
              viewBox="0 0 16 16"

              <path

            </svg>
          </a>
          <a
            href="mailto:devoluap@gmail.com"
            target="_blank"
            rel="noopener noreferrer"
            data-translate-title="home.email"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              fill="#0A090C"
              class="bi bi-envelope-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z"
              />
            </svg>
          </a>
        </section>
      </article>

      <article id="about" data-aos="fade-up">
        <div>
          <h2 class="content-title" data-translate="about.title"></h2>
        </div>
        <section>
          <p>
            <span data-translate="about.text"></span>
            <a
              href="imagens/cv.pdf"
              download
              data-translate="about.download"
            ></a>
          </p>
        </section>
      </article>

      <article id="knowledge" data-aos="fade-up">
        <div>
          <h2 class="content-title" data-translate="skills.title"></h2>
        </div>
        <section id="skills-section"></section>
      </article>

      <article id="projects" data-aos="fade-up">
        <div>
          <h2 class="content-title" data-translate="projects.title"></h2>
        </div>
        <div class="galery-pai">
          <div class="galery-filho">
            <div class="galery-neto" id="projects-container"></div>
          </div>
        </div>
      </article>
      <div id="modal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <img id="modal-img" data-translate-alt="modal.projectImageAlt" />
          <h2 id="modal-title"></h2>
          <p id="modal-desc"></p>
          <p id="modal-technologies"></p>
          <div id="alert-modal" class="alert-modal">
            <div class="alert-content">
              <p id="alert-message"></p>
              <button id="alert-close" data-translate="modal.close"></button>
            </div>
          </div>
          <div class="modal-links">
            <a
              id="modal-github"
              href="#"
              target="_blank"
              data-translate="modal.github"
            ></a>
            <a
              id="modal-site"
              href="#"
              target="_blank"
              data-translate="modal.site"
            ></a>
          </div>
        </div>
      </div>

      <article id="contact">
        <div>
          <h2 class="content-title" data-translate="contact.title"></h2>
        </div>
        <section>
          <p>
            <span data-translate="contact.email"></span>
            <a
              href="mailto:devoluap@gmail.com"
              target="_blank"
              rel="noopener noreferrer"
              data-translate-title="home.email"
            >
              devoluap@gmail.com
            </a>
          </p>
          <div>
            <a
              href="https://github.com/DevoluaP"
              target="_blank"
              rel="noopener noreferrer"
              data-translate-title="home.github"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                fill="#F0EDEE"
                class="bi bi-github"
                viewBox="0 0 16 16"
              >

                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"

            </a>
            <a

              target="_blank"
              rel="noopener noreferrer"
              data-translate-title="home.linkedin"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                fill="#F0EDEE"
                class="bi bi-linkedin"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"

              </svg>
            </a>
          </div>
        </section>
        <p class="back">
          <a
            href="#home"
            class="voltar-inicio"
            data-translate="contact.back"
          ></a>
