<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <meta property="og:title" content="Paulo Henrique | Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfólio de desenvolvimento, automação e inteligência artificial."
    />
    <meta
      property="og:image"
      content="https://DevoluaP.github.io/Meu_Portfolio/imagens/logo.svg"
    />
    <meta name="author" content="Paulo Henrique" />
    <link rel="canonical" href="https://DevoluaP.github.io/Meu_Portfolio/" />
    <link rel="shortcut icon" href="imagens/icon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <title></title>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

    <header class="site-header" id="site-header">
      <nav class="nav-shell" aria-label="Navegação principal">
        <a href="#home" class="brand" aria-label="início">
          <span class="brand-mark">/></span><span>aulo</span>
        </a>

        <div class="nav-links" id="nav-links">
          <a href="#about" data-translate="nav.about"></a>
          <a href="#experience" data-translate="nav.experience"></a>
          <a href="#knowledge" data-translate="nav.skills"></a>
          <a href="#projects" data-translate="nav.projects"></a>
          <a href="#contact" data-translate="nav.contact"></a>
        </div>

        <div class="nav-actions">
          <button
            id="btn-theme"
            class="icon-button"
            type="button"
            aria-label="Alternar tema"
          ></button>
          <div id="lang-dropdown" class="lang-dropdown">
            <button
              id="lang-dropdown-btn"
              class="language-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              data-translate-title="lang.select"
            >
              <img id="lang-current-flag" />
              <span id="lang-current-label"></span>
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="m4 6 4 4 4-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <ul
              id="lang-dropdown-list"
              class="lang-dropdown-list"
              role="listbox"
            ></ul>
          </div>
          <button
            id="btn-menu"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
          >
            <span></span><span></span>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <section id="home" class="hero section-shell">
        <div class="hero-orb orb-a" aria-hidden="true"></div>
        <div class="hero-orb orb-b" aria-hidden="true"></div>

        <div class="hero-content hero-enter">
          <p class="hero-kicker" data-translate="home.welcome"></p>
          <h1>
            <span>Paulo Henrique</span><br />
            <em data-translate="home.role"></em>
          </h1>
          <p class="hero-description" data-translate="home.description"></p>

          <div class="hero-actions">
            <a
              class="primary-button magnetic"
              href="#projects"
              data-translate="home.ctaProjects"
            ></a>
            <a
              class="ghost-button magnetic"
              href="imagens/cv.pdf"
              download
              id="hero-cv"
              data-translate="home.ctaCv"
            ></a>
          </div>

          <div class="social-row" aria-label="Links profissionais">
            <a
              class="social-link magnetic"
              href="https://github.com/DevoluaP"
              target="_blank"
              rel="noopener noreferrer"
              data-translate-title="home.github"
            >
              GitHub ↗
            </a>
            <a
              class="social-link magnetic"
              href="https://www.linkedin.com/in/devoluap"
              target="_blank"
              rel="noopener noreferrer"
              data-translate-title="home.linkedin"
            >
              LinkedIn ↗
            </a>
            <a
              class="social-link magnetic"
              href="mailto:devoluap@gmail.com"
              data-translate-title="home.email"
            >
              E-mail ↗
            </a>
          </div>
        </div>

        <div class="hero-art hero-enter hero-enter-delay">
          <div class="profile-orbit orbit-one"></div>
          <div class="profile-orbit orbit-two"></div>
          <div class="profile-orbit orbit-three"></div>
          <div class="profile-photo-wrap">
            <div class="profile-photo-ring"></div>
            <img
              class="profile-photo"
              src="imagens/foto-perfil.jpg"
              alt="Foto de Paulo Henrique"
              loading="eager"
            />
          </div>
        </div>
      </section>

      <section id="about" class="section-shell content-section reveal">
        <div class="section-heading-row">
          <h2 class="section-heading" data-translate="about.title"></h2>
        </div>
        <div class="about-grid">
          <div class="about-copy glass-card spotlight-card">
            <p class="typing-text" data-translate="about.text"></p>
            <a
              class="inline-link"
              href="imagens/cv.pdf"
              download
              id="about-cv"
              data-translate="about.download"
            ></a>
          </div>
          <div class="metrics-grid">
            <div class="metric-card glass-card">
              <span class="metric-number" data-target="13">0</span>
              <span data-translate="about.metricProjects"></span>
            </div>
            <div class="metric-card glass-card">
              <span class="metric-number" data-target="4">0</span>
              <span data-translate="about.metricTracks"></span>
            </div>
            <div class="metric-card glass-card">
              <span class="metric-number" data-target="17">0</span>
              <span data-translate="about.metricTools"></span>
            </div>
            <div class="metric-card glass-card">
              <span class="metric-number" data-target="3">0</span>
              <span data-translate="about.metricLearning"></span>
            </div>
          </div>
        </div>
      </section>

      <section id="experience" class="section-shell content-section reveal">
        <div class="section-heading-row">
          <h2 class="section-heading" data-translate="experience.title"></h2>
        </div>
        <div id="experience-list" class="timeline"></div>
      </section>

      <section id="knowledge" class="section-shell content-section reveal">
        <div class="section-heading-row">
          <h2 class="section-heading" data-translate="skills.title"></h2>
        </div>
        <div id="skills-section" class="skills-bento"></div>
      </section>

      <section id="education" class="section-shell content-section reveal">
        <div class="section-heading-row">
          <h2 class="section-heading" data-translate="education.title"></h2>
        </div>
        <div id="education-list" class="education-grid"></div>
      </section>

      <section id="projects" class="section-shell content-section reveal">
        <div class="section-heading-row">
          <h2 class="section-heading" data-translate="projects.title"></h2>
        </div>
        <div class="projects-toolbar">
          <div
            class="projects-filter"
            id="projects-filter"
            role="tablist"
            aria-label="Filtro de projetos"
          >
            <button
              class="filter-button active"
              data-filter="all"
              data-translate="projects.filters.all"
            ></button>
            <button
              class="filter-button"
              data-filter="web"
              data-translate="projects.filters.web"
            ></button>
            <button
              class="filter-button"
              data-filter="mobile"
              data-translate="projects.filters.mobile"
            ></button>
            <button
              class="filter-button"
              data-filter="automation"
              data-translate="projects.filters.automation"
            ></button>
          </div>
        </div>
        <div id="projects-container" class="projects-grid"></div>
      </section>

      <section id="contact" class="contact-section section-shell reveal">
        <div class="contact-panel glass-card spotlight-card">
          <div class="contact-copy">
            <h2 data-translate="contact.title"></h2>
            <p data-translate="contact.text"></p>
          </div>
          <div class="contact-actions">
            <a class="contact-email magnetic" href="mailto:devoluap@gmail.com">
              devoluap@gmail.com <span>↗</span>
            </a>
            <div class="contact-socials">
              <a
                class="contact-social-link"
                href="https://github.com/DevoluaP"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2.7a9.3 9.3 0 0 0-2.94 18.12c.46.08.63-.2.63-.45v-1.76c-2.57.56-3.11-1.09-3.11-1.09-.42-1.07-1.02-1.36-1.02-1.36-.84-.58.06-.57.06-.57.93.07 1.42.96 1.42.96.83 1.42 2.19 1.01 2.73.77.08-.6.33-1.01.6-1.25-2.05-.23-4.21-1.02-4.21-4.53 0-1 .36-1.81.95-2.45-.1-.23-.41-1.16.09-2.42 0 0 .78-.25 2.57.94a8.9 8.9 0 0 1 4.68 0c1.79-1.19 2.57-.94 2.57-.94.5 1.26.19 2.19.1 2.42.59.64.95 1.45.95 2.45 0 3.52-2.16 4.3-4.22 4.53.34.29.64.84.64 1.69v2.5c0 .25.17.53.64.45A9.3 9.3 0 0 0 12 2.7Z"
                    fill="currentColor"
                  />
                </svg>
                <span>↗</span>
              </a>
              <a
                class="contact-social-link"
                href="https://www.linkedin.com/in/devoluap"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.95v5.66H9.34V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.1 20.45H3.54V8.99H7.1v11.46ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46C23.21 24 24 23.23 24 22.28V1.72C24 .77 23.21 0 22.23 0Z"
                    fill="currentColor"
                  />
                </svg>
                <span>↗</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Paulo Henrique</span>
      <a class="back-to-top" href="#home" aria-label="Voltar ao topo">↑</a>
    </footer>

    <div id="modal" class="modal" aria-hidden="true">
      <div
        class="modal-content glass-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button
          class="modal-close"
          id="modal-close"
          type="button"
          aria-label="Fechar"
        >
          ×
        </button>
        <button
          class="modal-image-wrap image-expand-trigger"
          id="modal-image-trigger"
          type="button"
          aria-label="Abrir imagem em tela cheia"
        >
          <img id="modal-img" data-translate-alt="modal.projectImageAlt" />
          <span class="image-expand-hint"> ⤢ <span>expandir</span> </span>
        </button>
        <div class="modal-copy">
          <h2 id="modal-title"></h2>
          <p id="modal-desc"></p>
          <p id="modal-technologies" class="modal-tech"></p>
          <div class="modal-links">
            <a
              id="modal-github"
              class="primary-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              data-translate="modal.github"
            ></a>
            <a
              id="modal-site"
              class="ghost-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              data-translate="modal.site"
            ></a>
          </div>
        </div>
      </div>
    </div>

    <div id="image-lightbox" class="image-lightbox" aria-hidden="true">
      <button
        class="image-lightbox-close"
        id="image-lightbox-close"
        type="button"
        aria-label="Fechar imagem"
      >
        ×
      </button>
      <div class="image-lightbox-stage">
        <img id="image-lightbox-img" />
      </div>
    </div>

    <div id="alert-modal" class="alert-modal" aria-hidden="true">
      <div class="alert-content glass-card">
        <p id="alert-message"></p>
        <button
          id="alert-close"
          class="ghost-button"
          data-translate="modal.close"
        ></button>
      </div>
    </div>

    <noscript>
      Ative o JavaScript para visualizar o portfólio completo.
    </noscript>
    <script src="js/script.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
  </body>
</html>
